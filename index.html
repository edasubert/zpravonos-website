---
layout: default
---
<ul class="post-list">
  {% for post in site.posts %}
  <li>
    <a href="{{ post.url | relative_url }}">{{ post.date | date: "%-d. %-m. %Y" }} — {{ post.title }}</a>
  </li>
  {% endfor %}
</ul>
{% unless site.posts.size > 0 %}
<p class="empty">Zatím žádné přehledy.</p>
{% endunless %}
